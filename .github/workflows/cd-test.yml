name: cd-test

# Empaqueta el escritorio Release como feed Squirrel.
# Nunca sube a s3://ariescontadorcr/updates/ (produccion).
# El exe empaquetado debe apuntar a updates-test en el bucket real de clientes.
#
# Artifact: squirrel-feed-test
# S3 opcional: s3://ariescontadorcr/updates-test/
# Secrets: environment GitHub "test" (ARIES_MYSQL_CONNECTION, ARIES_UPDATE_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# No usar environment production/prod en este workflow.

on:
  workflow_dispatch:
    inputs:
      include_upgrade_chain:
        description: 'Bajar el feed publico de produccion y releasify encima (ensayo de delta, no publica a S3 prod)'
        type: boolean
        default: false
      publish_to_s3:
        description: 'Subir el feed a s3://ariescontadorcr/updates-test/'
        type: boolean
        default: false

concurrency:
  group: cd-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack-squirrel:
    runs-on: windows-latest
    environment: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('nuget.config', '**/packages.config', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: nuget restore Aries.sln

      - name: Guard secrets
        shell: pwsh
        run: ./scripts/Verify-NoSecrets.ps1

      - name: Build Release
        run: msbuild Aries.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Test Core
        run: dotnet test tests\AriesContador.Tests\AriesContador.Tests.csproj --configuration Release --nologo

      - name: Test Desktop
        run: dotnet test tests\Aries.Desktop.Tests\Aries.Desktop.Tests.csproj --configuration Release --nologo

      - name: Verify publish folder
        shell: pwsh
        run: |
          ./scripts/Verify-DesktopPublish.ps1 `
            -OutputDir "src/desktop/Aries.Desktop/bin/Release" `
            -AppConfig "src/desktop/Aries.Desktop/App.Production.config" `
            -ProjectFile "src/desktop/Aries.Desktop/Aries.Desktop.csproj"

      - name: Pack Squirrel (AriesUpdater / updates-test)
        id: squirrel
        env:
          ARIES_MYSQL_CONNECTION: ${{ secrets.ARIES_MYSQL_CONNECTION }}
          ARIES_UPDATE_URL: ${{ secrets.ARIES_UPDATE_URL }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARIES_MYSQL_CONNECTION)) {
            throw 'Falta el secret ARIES_MYSQL_CONNECTION. Environment test > Secrets. Valor = connection string de RDS, sin comillas.'
          }
          if ([string]::IsNullOrWhiteSpace($env:ARIES_UPDATE_URL)) {
            throw 'Falta el secret ARIES_UPDATE_URL. Environment test > Secrets. Valor = https://ariescontadorcr.s3.us-east-2.amazonaws.com/updates-test/ (con slash final, sin comillas).'
          }
          function Escape-Xml([string]$s) {
            return ($s -replace '&', '&amp;' -replace '<', '&lt;' -replace '>', '&gt;' -replace '"', '&quot;')
          }
          $db = Escape-Xml $env:ARIES_MYSQL_CONNECTION
          $updateUrl = Escape-Xml $env:ARIES_UPDATE_URL.Trim()
          $overlay = Join-Path $env:RUNNER_TEMP 'App.Test.pack.config'
          $overlayXml = '<?xml version="1.0" encoding="utf-8"?><configuration><connectionStrings>' +
            "<add name=`"DBconnectionString`" connectionString=`"$db`" />" +
            "<add name=`"UpdateServerString`" connectionString=`"$updateUrl`" />" +
            '<add name="HttpBaseUrl" connectionString="http://arieswebapi7-dev.eba-32ctm9kr.us-east-2.elasticbeanstalk.com/" />' +
            '<add name="IsBeta" connectionString="true" /></connectionStrings></configuration>'
          [System.IO.File]::WriteAllText($overlay, $overlayXml, (New-Object System.Text.UTF8Encoding $false))

          $packArgs = @{
            PackageId = 'AriesUpdater'
            ExpectedUpdateUrlContains = 'updates-test'
            ConnectionStringsConfig = $overlay
          }
          if ('${{ inputs.include_upgrade_chain }}' -eq 'true') {
            ./scripts/ops/Download-SquirrelFeed.ps1 -OutDir ./publish/squirrel-previous
            $packArgs.PreviousFeedDir = './publish/squirrel-previous'
          }
          ./scripts/Pack-Squirrel.ps1 @packArgs
          Get-ChildItem ./publish/squirrel | Format-Table Name, Length -AutoSize

      - name: Upload Squirrel feed
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-feed-test
          path: publish/squirrel

      - name: Check AWS secrets
        if: ${{ inputs.publish_to_s3 }}
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AWS_ACCESS_KEY_ID) -or [string]::IsNullOrWhiteSpace($env:AWS_SECRET_ACCESS_KEY)) {
            throw 'Faltan secrets AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY. Settings > Secrets and variables > Actions (Secrets, no Variables).'
          }
          Write-Host "AWS secrets presentes."

      - name: Configure AWS
        if: ${{ inputs.publish_to_s3 }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Publish to S3 updates-test
        if: ${{ inputs.publish_to_s3 }}
        shell: pwsh
        run: ./scripts/ops/Publish-SquirrelFeed.ps1 -Environment Test
