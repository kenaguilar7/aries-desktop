# Local tipo prod: MySQL + API en contenedores. Nunca RDS.
# Escritorio Debug sigue en el host y habla con:
#   MySQL  127.0.0.1:3307
#   API    http://localhost:5088/
#
# Si ya existe aries_mysql_local en 3307, start-local.ps1 no crea otro MySQL.

name: aries-local

services:
  mysql:
    image: mysql:8.0
    container_name: aries_mysql_local
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aries_root_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aries}
      MYSQL_USER: ${MYSQL_USER:-kenneth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-bin-trust-function-creators=1
    volumes:
      - aries-mysql-data:/var/lib/mysql
      - ./scripts/mysql/grant_routine_replace.sql:/docker-entrypoint-initdb.d/01_grant_routine_replace.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/hosts/Aries.WebAPI/Dockerfile
    image: aries-webapi:local
    container_name: aries_api_local
    ports:
      - "${API_PORT:-5088}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MySQLDefault: "Server=host.docker.internal;Port=${MYSQL_PORT:-3307};User id=${MYSQL_USER:-kenneth};Password=${MYSQL_PASSWORD:-1234};Database=${MYSQL_DATABASE:-aries};Allow User Variables=True"
      Jwt__Key: ${JWT_KEY:-AriesContador-dev-jwt-key-change-me-32}
      Jwt__Issuer: Aries.WebAPI
      Jwt__Audience: Aries.Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
        required: false

volumes:
  aries-mysql-data:
