name: cd-api

# Reusable: construye Aries.WebAPI, sube a ECR (us-east-2) y despliega ECS Express Mode.
# Llamado por cd-api-test.yml y cd-api-prod.yml. No disparar este archivo a mano.

on:
  workflow_call:
    inputs:
      github_environment:
        description: 'Environment GitHub (test | Prod)'
        required: true
        type: string
      aspnetcore_environment:
        description: 'ASPNETCORE_ENVIRONMENT del contenedor'
        required: true
        type: string
      service_name:
        description: 'Nombre del servicio Express Mode'
        required: true
        type: string
      image_channel:
        description: 'Tag movible en ECR (test | prod)'
        required: true
        type: string
      max_task_count:
        description: 'Max tasks Fargate'
        required: false
        type: number
        default: 2
      confirm:
        description: 'Debe ser production si github_environment es Prod'
        required: false
        type: string
        default: ''
      git_tag:
        description: 'Opcional: tag vX.Y.Z. Vacío = rama seleccionada'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: aries-webapi
    steps:
      - name: Confirm production
        if: ${{ inputs.github_environment == 'Prod' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
          GIT_TAG: ${{ inputs.git_tag }}
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_CHANNEL: ${{ inputs.image_channel }}
          ASPNETCORE_ENVIRONMENT: ${{ inputs.aspnetcore_environment }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "production" ]; then
            echo "Abortado: en confirm hay que escribir exactamente production." >&2
            exit 1
          fi
          if [ "$SERVICE_NAME" != "aries-api-prod" ]; then
            echo "Abortado: servicio de produccion debe ser aries-api-prod (recibido: $SERVICE_NAME)." >&2
            exit 1
          fi
          if [ "$IMAGE_CHANNEL" != "prod" ]; then
            echo "Abortado: image_channel de produccion debe ser prod." >&2
            exit 1
          fi
          if [ "$ASPNETCORE_ENVIRONMENT" != "Production" ]; then
            echo "Abortado: ASPNETCORE_ENVIRONMENT de produccion debe ser Production." >&2
            exit 1
          fi
          TAG="${GIT_TAG#"${GIT_TAG%%[![:space:]]*}"}"
          TAG="${TAG%"${TAG##*[![:space:]]}"}"
          if [ -n "$TAG" ] && [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "git_tag '$TAG' debe ser vX.Y.Z (ejemplo v1.2.0) o quedar vacio." >&2
            exit 1
          fi
          echo "confirm=production service=$SERVICE_NAME channel=$IMAGE_CHANNEL tag=$TAG"

      - uses: actions/checkout@v4
        if: ${{ inputs.git_tag != '' }}
        with:
          ref: ${{ inputs.git_tag }}

      - uses: actions/checkout@v4
        if: ${{ inputs.git_tag == '' }}

      - name: Match version
        if: ${{ inputs.github_environment == 'Prod' && inputs.git_tag != '' }}
        env:
          GIT_TAG: ${{ inputs.git_tag }}
        run: |
          set -euo pipefail
          TAG="${GIT_TAG#v}"
          VERSION=$(python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("version.props").read_text(encoding="utf-8")
          match = re.search(r"AriesVersion>([^<]+)<", text)
          if not match:
              raise SystemExit("version.props no tiene AriesVersion.")
          print(match.group(1).strip())
          PY
          )
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG no coincide con version.props $VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Guard secrets
        shell: pwsh
        run: ./scripts/Verify-NoSecrets.ps1

      - name: Test API contract
        run: dotnet test tests/Aries.WebAPI.Tests/Aries.WebAPI.Tests.csproj --configuration Release --nologo

      - name: Check deploy secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ARIES_MYSQL_CONNECTION: ${{ secrets.ARIES_MYSQL_CONNECTION }}
          ARIES_JWT_KEY: ${{ secrets.ARIES_JWT_KEY }}
          ASPNETCORE_ENVIRONMENT: ${{ inputs.aspnetcore_environment }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "Faltan secrets AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY del environment ${{ inputs.github_environment }}." >&2
            exit 1
          fi
          if [ -z "${ARIES_MYSQL_CONNECTION}" ]; then
            echo "Falta el secret ARIES_MYSQL_CONNECTION (RDS de este environment, sin comillas)." >&2
            exit 1
          fi
          case "${ARIES_MYSQL_CONNECTION}" in
            *Server=*|*Host=*) ;;
            *) echo "ARIES_MYSQL_CONNECTION debe incluir Server= o Host=." >&2; exit 1 ;;
          esac
          if [ -z "${ARIES_JWT_KEY}" ]; then
            echo "Falta el secret ARIES_JWT_KEY (>= 32 caracteres, distinto de Local)." >&2
            exit 1
          fi
          python3 - <<'PY'
          import os, sys
          key = os.environ["ARIES_JWT_KEY"]
          env_name = os.environ["ASPNETCORE_ENVIRONMENT"]
          if "change-me" in key.lower():
              sys.exit("ARIES_JWT_KEY no puede ser el placeholder change-me.")
          if len(key) < 32:
              sys.exit("ARIES_JWT_KEY debe tener al menos 32 caracteres.")
          if env_name == "Production" and "aries-test" in os.environ["ARIES_MYSQL_CONNECTION"].lower():
              sys.exit("ARIES_MYSQL_CONNECTION de produccion no puede apuntar a aries-test.")
          print("Secrets de deploy presentes.")
          PY

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Resolve AWS account and roles
        id: aws
        env:
          EXEC_ROLE: ${{ vars.ECS_EXECUTION_ROLE }}
          INFRA_ROLE: ${{ vars.ECS_INFRA_ROLE }}
          CLUSTER: ${{ vars.ECS_CLUSTER }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EXEC_NAME="${EXEC_ROLE:-ecsTaskExecutionRole}"
          INFRA_NAME="${INFRA_ROLE:-ecsInfrastructureRoleForExpressServices}"
          CLUSTER_NAME="${CLUSTER:-default}"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "cluster=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "execution_role_arn=arn:aws:iam::${ACCOUNT_ID}:role/${EXEC_NAME}" >> "$GITHUB_OUTPUT"
          echo "infra_role_arn=arn:aws:iam::${ACCOUNT_ID}:role/${INFRA_NAME}" >> "$GITHUB_OUTPUT"
          echo "account=$ACCOUNT_ID cluster=$CLUSTER_NAME exec=$EXEC_NAME infra=$INFRA_NAME"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
            echo "Creado ECR $ECR_REPOSITORY"
          else
            echo "ECR $ECR_REPOSITORY ya existe"
          fi

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$SHA" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/hosts/Aries.WebAPI/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container environment
        id: container-env
        env:
          ARIES_MYSQL_CONNECTION: ${{ secrets.ARIES_MYSQL_CONNECTION }}
          ARIES_JWT_KEY: ${{ secrets.ARIES_JWT_KEY }}
          ASPNETCORE_ENVIRONMENT: ${{ inputs.aspnetcore_environment }}
        run: |
          set -euo pipefail
          python3 >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          print("json<<EOF")
          print(json.dumps([
              {"name": "ASPNETCORE_ENVIRONMENT", "value": os.environ["ASPNETCORE_ENVIRONMENT"]},
              {"name": "ConnectionStrings__MySQLDefault", "value": os.environ["ARIES_MYSQL_CONNECTION"]},
              {"name": "Jwt__Key", "value": os.environ["ARIES_JWT_KEY"]},
              {"name": "Jwt__Issuer", "value": "Aries.WebAPI"},
              {"name": "Jwt__Audience", "value": "Aries.Desktop"},
          ]))
          print("EOF")
          PY

      - name: Deploy to ECS Express Mode
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ inputs.service_name }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          execution-role-arn: ${{ steps.aws.outputs.execution_role_arn }}
          infrastructure-role-arn: ${{ steps.aws.outputs.infra_role_arn }}
          cluster: ${{ steps.aws.outputs.cluster }}
          container-port: 8080
          health-check-path: /health
          cpu: "256"
          memory: "512"
          min-task-count: 1
          max-task-count: ${{ inputs.max_task_count }}
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: "70"
          environment-variables: ${{ steps.container-env.outputs.json }}
          subnets: ${{ vars.ECS_SUBNETS }}
          security-groups: ${{ vars.ECS_SECURITY_GROUPS }}
          tags: |
            App=Aries.WebAPI
            Environment=${{ inputs.image_channel }}

      - name: Smoke /health
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
        run: |
          set -euo pipefail
          EP="${ENDPOINT:-}"
          if [ -z "$EP" ]; then
            echo "El deploy no devolvio endpoint." >&2
            exit 1
          fi
          EP="${EP%/}"
          case "$EP" in
            http://*|https://*) ;;
            *) EP="https://$EP" ;;
          esac
          echo "GET $EP/health"
          curl -fsS --retry 12 --retry-all-errors --retry-delay 5 "$EP/health"
          echo
          echo "OK $EP"
