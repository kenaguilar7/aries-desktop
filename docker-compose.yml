# MySQL local para el escritorio y Aries.WebAPI. Nunca RDS producción.
# Si ya tienes un contenedor en 3307 (p. ej. aries_mysql_local), no levantes otro:
#   docker ps --filter "publish=3307"
# Uso desde cero: copia .env.example a .env  →  .\scripts\local\start-local.ps1

name: aries-local

services:
  mysql:
    image: mysql:8.0
    container_name: AriesContabilidad_Local
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aries_root_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aries}
      MYSQL_USER: ${MYSQL_USER:-kenneth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - aries-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  aries-mysql-data:
