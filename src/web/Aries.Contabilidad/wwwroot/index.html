<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Aries Contabilidad</title>
    <base href="/" />
    <script>
        window.ariesTheme = {
            apply: function (theme) {
                var value = theme === "dark" ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", value);
                document.documentElement.setAttribute("data-bs-theme", value);
            },
            get: function () {
                try { return localStorage.getItem("aries-theme"); } catch (e) { return null; }
            },
            set: function (theme) {
                var value = theme === "dark" ? "dark" : "light";
                try { localStorage.setItem("aries-theme", value); } catch (e) { }
                this.apply(value);
            },
            prefersDark: function () {
                return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
            }
        };
        (function () {
            try {
                var stored = window.ariesTheme.get();
                var theme = (stored === "dark" || stored === "light")
                    ? stored
                    : (window.ariesTheme.prefersDark() ? "dark" : "light");
                window.ariesTheme.apply(theme);
            } catch (e) { }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css?v=gh3" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Aries.Contabilidad.styles.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="loading-progress">
            <svg class="app-logo" viewBox="0 0 16 16" width="40" height="40" aria-hidden="true">
                <path fill="currentColor" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM4.75 5.5h6.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1 0-1.5Zm0 3.5h6.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1 0-1.5Z" />
            </svg>
            <h1>Aries Contabilidad</h1>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/asientos.js"></script>
    <script>
        window.ariesPrint = function (html) {
            var w = window.open('', '_blank');
            if (!w) return;
            w.document.write(html);
            w.document.close();
            w.focus();
            w.print();
        };
    </script>
</body>

</html>
