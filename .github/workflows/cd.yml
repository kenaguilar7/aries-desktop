name: CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('nuget.config', '**/packages.config', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: nuget restore Aries.sln

      - name: Guard secrets
        shell: pwsh
        run: ./scripts/Verify-NoSecrets.ps1

      - name: Build Release
        run: msbuild Aries.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Check tag vs AssemblyFileVersion
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $info = Get-Content -LiteralPath 'src/desktop/Aries.Desktop/Properties/AssemblyInfo.cs' -Raw
          if ($info -notmatch 'AssemblyFileVersion\("([^"]+)"\)') {
            throw 'No hay AssemblyFileVersion en AssemblyInfo.cs'
          }
          $ver = $Matches[1]
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$ver") {
            throw "El tag $tag no coincide con AssemblyFileVersion $ver (se esperaba v$ver)"
          }
          Write-Host "Tag $tag coincide con AssemblyFileVersion $ver"

      - name: Pack Squirrel
        id: squirrel
        shell: pwsh
        run: ./scripts/Pack-Squirrel.ps1

      - name: Publish API zip
        shell: pwsh
        run: |
          $ver = '${{ steps.squirrel.outputs.version }}'
          if (-not $ver) { throw 'Pack-Squirrel no exporto version' }
          $out = 'publish/api'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish src/hosts/Aries.WebAPI/Aries.WebAPI.csproj -c Release -o $out --nologo
          if (Test-Path (Join-Path $out 'appsettings.Local.json')) {
            throw 'El publish del API incluye appsettings.Local.json'
          }
          $zip = "publish/aries-webapi-$ver.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$out\*" -DestinationPath $zip
          Write-Host "API zip $zip"

      - name: Upload Squirrel feed
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-feed
          path: publish/squirrel

      - name: Upload API zip
        uses: actions/upload-artifact@v4
        with:
          name: aries-webapi
          path: publish/aries-webapi-*.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/squirrel/**
            publish/aries-webapi-*.zip
