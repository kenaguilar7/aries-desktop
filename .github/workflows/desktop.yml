name: desktop

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

jobs:
  build-test-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore
        run: nuget restore "Aries Contador.sln"

      - name: Guard secrets
        shell: pwsh
        run: ./scripts/Verify-NoSecrets.ps1

      - name: Build Release
        run: msbuild "Aries Contador.sln" /restore /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Test Core
        run: dotnet test AriesContador.Tests\AriesContador.Tests.csproj --configuration Release --nologo

      - name: Test Desktop
        run: dotnet test Aries.Desktop.Tests\Aries.Desktop.Tests.csproj --configuration Release --nologo

      - name: Test API contract
        run: dotnet test Aries.WebAPI.Tests\Aries.WebAPI.Tests.csproj --configuration Release --nologo

      - name: Test database migrations
        run: dotnet test Aries.Data.Tests\Aries.Data.Tests.csproj --configuration Release --nologo

      - name: Verify publish folder
        shell: pwsh
        run: |
          ./scripts/Verify-DesktopPublish.ps1 `
            -OutputDir "CapaPresentacion/bin/Release" `
            -AppConfig "CapaPresentacion/App.Production.config" `
            -ProjectFile "CapaPresentacion/CapaPresentacion.csproj" `
            -CheckDns
